# Frontend code services (need build). Requires backend + infra.
# Usage:
#   docker compose -f docker-compose.infra.yml -f docker-compose.backend.yml -f docker-compose.frontend.yml up -d
services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
    restart: always
    depends_on:
      - api
    networks:
      - plane-net

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
    restart: always
    depends_on:
      - api
      - web
    networks:
      - plane-net

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
    restart: always
    depends_on:
      - api
      - web
    networks:
      - plane-net

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
    restart: always
    networks:
      - plane-net

  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - space
      - admin
    networks:
      - plane-net

networks:
  plane-net:
    name: plane-net
    driver: bridge
