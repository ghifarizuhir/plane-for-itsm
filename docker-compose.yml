services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web

  # Django fallback for un-ported boundaries (asset S3 upload/download,
  # Unsplash/GPT external, analytic export, notification sending, OAuth).
  # Opt-in only: docker compose --profile legacy up -d api-legacy
  # (internal http://api-legacy:8000; async publish paths need a broker).
  api-legacy:
    container_name: api-legacy
    profiles: ["legacy"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  # Rust cutover: primary api on 8000 (proxy upstreams api:8000 unchanged).
  # SECRET_KEY wiring (shared with Django, no second secret): `setup.sh`
  # appends the generated SECRET_KEY to `apps/api/.env`, and this service
  # (like `worker`/`beat` below) consumes that SAME file via `env_file`,
  # so Rust Fernet (`instance_admin.rs:fernet_secret`) decrypts with the
  # exact value Django used to encrypt.
  api:
    container_name: api-rs
    build:
      context: ./apps/api-rs
      dockerfile: Dockerfile.rs
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: /usr/local/bin/api
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 8000
      DATABASE_URL: postgres://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379
    depends_on:
      - plane-db
      - plane-redis
    ports:
      - "8000:8000"

  # Django celery worker/beat removed (superseded by Rust worker on the
  # plane:jobs Redis Stream; plane-mq removed below).
  worker:
    container_name: worker-rs
    build:
      context: ./apps/api-rs
      dockerfile: Dockerfile.rs
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: /usr/local/bin/worker
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 8001
      DATABASE_URL: postgres://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379
    depends_on:
      - plane-db
      - plane-redis

  beat-worker:
    container_name: beat-rs
    build:
      context: ./apps/api-rs
      dockerfile: Dockerfile.rs
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: /usr/local/bin/beat
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 8001
      DATABASE_URL: postgres://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379
    depends_on:
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=100'
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # plane-mq (RabbitMQ) removed: Rust worker/beat use the plane:jobs
  # Redis Stream. api-legacy async publish paths need a broker if re-enabled.
  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
