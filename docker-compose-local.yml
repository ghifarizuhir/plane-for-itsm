services:
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

  plane-minio:
    image: minio/minio
    restart: unless-stopped
    networks:
      - dev_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} &&
      mc mb myminio/${AWS_S3_BUCKET_NAME} -p || true
      && tail -f /dev/null
      "
    volumes:
      - uploads:/export
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9090:9090"

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    networks:
      - dev_env
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Rust backend (apps/api-rs). Skema DB tetap via `migrator` Django di bawah.
  api:
    image: plane-api-rs:local
    build:
      context: ./apps/api-rs
      dockerfile: Dockerfile.rs
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    networks:
      - dev_env
    command: /usr/local/bin/api
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 8000
      DATABASE_URL: postgres://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379
    depends_on:
      - plane-db
      - plane-redis
    ports:
      - "8000:8000"

  worker:
    # Reuse image built by `api` (same Dockerfile.rs).
    image: plane-api-rs:local
    restart: unless-stopped
    networks:
      - dev_env
    command: /usr/local/bin/worker
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 8001
      DATABASE_URL: postgres://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    # Reuse image built by `api` (same Dockerfile.rs).
    image: plane-api-rs:local
    restart: unless-stopped
    networks:
      - dev_env
    command: /usr/local/bin/beat
    env_file:
      - ./apps/api/.env
    environment:
      PORT: 8001
      DATABASE_URL: postgres://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

volumes:
  redisdata:
  uploads:
  pgdata:
  rabbitmq_data:

networks:
  dev_env:
    driver: bridge
